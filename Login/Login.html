<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POTTER | Login</title>

    <link rel="stylesheet" href="estilizaçãoLogin.css">
    <link rel="stylesheet" href="layoutLogin.css">
</head>
<body>

    <header>
        <div class="logo">
            <img src="imgsLogin/logo.png" alt="Logo POTTER">
        </div>

        <div>
            <a href="../Login/Login.html" class="ativo">Login</a>
            <a href="../Cadastro/Cadastro.html">Cadastro</a>
        </div>
    </header>

    <main>
        <section class="cadastro">
            <p class="subtitulo">BEM-VINDO DE VOLTA</p>

            <h2>Entre na sua<br>conta Potter.</h2>

            <p class="descricao">
                Acesse sua conta para explorar o catálogo,
                acompanhar seus pedidos e conhecer nossas peças.
            </p>

            <form onsubmit="event.preventDefault(); verificarLogin();">
                <input
                    type="email"
                    placeholder="E-mail"
                    required
                    id="gmailLogin"
                    autocomplete="email"
                >

                <input
                    type="password"
                    placeholder="Senha"
                    required
                    id="senhaLogin"
                    autocomplete="current-password"
                >

                <button type="submit">Entrar →</button>
            </form>

            <div class="divisor">
                <p>OU</p>
            </div>

            <p class="entrar">
                Ainda não tem uma conta?
                <a href="../Cadastro/Cadastro.html">Cadastre-se</a>
            </p>

            <p class="entrar" style="margin-top: 18px;">
                <a href="../RecuperarSenha/Recuperar.html">Esqueceu sua senha?</a>
            </p>
        </section>
    </main>

    <script src="Login.js"></script>
</body>
</html>
